{% extends "hostels/base.html" %}
{% load static %}
{% block content %}
<!-- section-header.// -->

<!-- ========================= SECTION MAIN ========================= -->
<section class="section-intro padding-y-sm">
  <div class="container">
    <div class="intro-banner-wrap">
      <img src="{% static "hostels/images/banners/1.jpg" %}" class="img-fluidrounded">
    </div>
  </div>
  <!-- container //  -->
</section>
<!-- ========================= SECTION MAIN END// ========================= -->

<!-- ========================= SECTION  ========================= -->
<section class="section-name padding-y-sm">
  <div class="container">
    <header class="section-heading">
      <a href="./store.html" class="btn btn-outline-primary float-right"
        >See all</a
      >
      <h3 class="section-title">Popular products</h3>
    </header>
    <!-- sect-heading -->

    <div class="row">
      {% for hostel in hostels %}
      <div class="col-md-3">
        <div class="card card-product-grid">
          <a href="{{ hostel.get_absolute_url }}" class="img-wrap">
            <img src="{{ hostel.hostel_image.url }}" />
          </a>
          <figcaption class="info-wrap">
            <a href="{{ hostel.get_absolute_url }}" class="title"
              >{{ hostel.hostel_name}}</a
            >
            <div class="price mt-1">&cent;{{ hostel.hostel_price}}</div>
            <!-- price-wrap.// -->
          </figcaption>
        </div>
      </div>
      {% endfor %}
    </div>
    <!-- row.// -->
  </div>
  <!-- container // -->
</section>
<!-- ========================= SECTION  END// ========================= -->
{% endblock content %}
