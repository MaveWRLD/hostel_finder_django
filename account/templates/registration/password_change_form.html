{% extends "hostels/base.html" %}
{%  load crispy_forms_tags %}
{% block content %}
<!-- ========================= SECTION CONTENT ========================= -->
<section class="section-content padding-y">
	
<!-- ============================ COMPONENT REGISTER   ================================= -->
<div class="card mx-auto" style="max-width:520px; margin-top:10px;">
      <article class="card-body">
		<header class="mb-4"><h4 class="card-title">Change Password</h4></header>
		<form method="POST">
			<div class="form-row">
				   {{ form|crispy }}
				  <input type="submit" value="Change" class="btn btn-primary btn-block">
				  {% csrf_token %}
			</div> <!-- form-group// -->        
		</form>
		</article><!-- card-body.// -->
   </div> <!-- card .// -->
<br><br>
</section>
<!-- ========================= SECTION CONTENT END// ========================= -->
{% endblock content %}
